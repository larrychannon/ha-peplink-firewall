[project]
name = "ha-peplink-firewall"
version = "0.1.0"
description = "Home Assistant switches for tagged Peplink outbound firewall rules"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant>=2026.10.0,<2026.11.0",
  "pytest>=8",
  "pytest-asyncio>=1",
  "pytest-homeassistant-custom-component==0.13.372",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
